<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Debian 12 Cloud Workstation | واجهة العمل السحابية</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Cairo", Helvetica, Arial, sans-serif; background: #0f111a; color: #fff; }
    
    /* Login Modal */
    #login-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at center, #1e2030 0%, #0a0b10 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
    .login-box {
      background: #181926;
      border: 1px solid #2e3148;
      border-radius: 12px;
      padding: 32px;
      width: 380px;
      max-width: 90%;
      box-shadow: 0 16px 40px rgba(0,0,0,0.6);
      text-align: center;
    }
    .login-icon {
      width: 56px;
      height: 56px;
      background: #e95420;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      box-shadow: 0 4px 15px rgba(233,84,32,0.4);
    }
    .login-title { font-size: 19px; font-weight: 700; margin-bottom: 6px; color: #fff; }
    .login-sub { font-size: 13px; color: #8e94b2; margin-bottom: 24px; }
    .form-group { text-align: right; margin-bottom: 16px; }
    .form-group label { display: block; font-size: 12px; color: #a5abbf; margin-bottom: 6px; font-weight: 600; }
    .form-group input {
      width: 100%;
      padding: 10px 14px;
      background: #0f1019;
      border: 1px solid #2d3045;
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      outline: none;
      direction: ltr;
      transition: border-color 0.2s;
    }
    .form-group input:focus { border-color: #3b82f6; }
    .btn-login {
      width: 100%;
      padding: 12px;
      background: #3b82f6;
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s, transform 0.1s;
    }
    .btn-login:hover { background: #2563eb; }
    .btn-login:active { transform: scale(0.98); }
    .error-msg { color: #ef4444; font-size: 13px; margin-top: 12px; display: none; }

    /* Workstation Header & Content */
    #workstation { display: none; width: 100%; height: 100%; flex-direction: column; }
    #header {
      height: 48px;
      background: #181926;
      border-bottom: 1px solid #282a3d;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      user-select: none;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 14px;
    }
    .brand-badge {
      background: #e95420;
      color: #fff;
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 4px;
      font-weight: bold;
    }
    .tabs {
      display: flex;
      gap: 6px;
      background: #10111a;
      padding: 4px;
      border-radius: 8px;
      border: 1px solid #252738;
    }
    .tab-btn {
      background: transparent;
      border: none;
      color: #9ea3be;
      padding: 6px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
      font-family: inherit;
    }
    .tab-btn:hover { color: #fff; background: rgba(255,255,255,0.06); }
    .tab-btn.active { background: #3b82f6; color: #fff; box-shadow: 0 2px 8px rgba(59,130,246,0.35); }
    .controls { display: flex; align-items: center; gap: 8px; }
    .btn-ctrl {
      background: #222436;
      border: 1px solid #32354d;
      color: #b5bad1;
      padding: 5px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
      font-family: inherit;
    }
    .btn-ctrl:hover { background: #2f324d; color: #fff; }
    .btn-logout { border-color: #5c2b2b; color: #f87171; }
    .btn-logout:hover { background: #451a1a; color: #fca5a5; }

    #content { width: 100%; flex: 1; position: relative; background: #000; }
    iframe { width: 100%; height: 100%; border: none; position: absolute; top: 0; left: 0; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <!-- Login Gate -->
  <div id="login-overlay">
    <div class="login-box">
      <div class="login-icon">
        <svg width="26" height="26" fill="none" stroke="#fff" stroke-width="2.2" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </div>
      <div class="login-title">Debian 12 Cloud Workstation</div>
      <div class="login-sub">سجل الدخول للوصول إلى سطح المكتب والطرفية</div>
      <form onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>اسم المستخدم (Username):</label>
          <input type="text" id="username" value="admin" required autocomplete="username">
        </div>
        <div class="form-group">
          <label>كلمة المرور (Password):</label>
          <input type="password" id="password" placeholder="أدخل كلمة المرور" required autocomplete="current-password" autofocus>
        </div>
        <button type="submit" class="btn-login">تسجيل الدخول / Login</button>
        <div id="error-msg" class="error-msg">كلمة المرور غير صحيحة، حاول مجدداً</div>
      </form>
    </div>
  </div>

  <!-- Workstation Interface -->
  <div id="workstation">
    <div id="header">
      <div class="brand">
        <span class="brand-badge">Debian 12</span>
        <span>واجهة العمل السحابية (XFCE GUI)</span>
      </div>
      <div class="tabs">
        <button class="tab-btn active" id="tab-vnc" onclick="showTab('vnc')">
          <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
          سطح المكتب (Desktop XFCE)
        </button>
        <button class="tab-btn" id="tab-term" onclick="showTab('term')">
          <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
          الطرفية (Terminal)
        </button>
      </div>
      <div class="controls">
        <button class="btn-ctrl" onclick="toggleFullscreen()">
          <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
          ملء الشاشة
        </button>
        <button class="btn-ctrl" onclick="reloadActive()">
          <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
          تحديث
        </button>
        <button class="btn-ctrl btn-logout" onclick="handleLogout()">
          <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          قفل الواجهة
        </button>
      </div>
    </div>
    <div id="content">
      <iframe id="frame-vnc" src="about:blank"></iframe>
      <iframe id="frame-term" class="hidden" src="about:blank"></iframe>
    </div>
  </div>

  <script>
    let activeTab = 'vnc';
    const VALID_PASS = "Antigravity2026!";

    function checkAuth() {
      const auth = sessionStorage.getItem('debian_auth');
      if (auth === 'true') {
        document.getElementById('login-overlay').style.display = 'none';
        const ws = document.getElementById('workstation');
        ws.style.display = 'flex';
        loadFrames();
      } else {
        document.getElementById('login-overlay').style.display = 'flex';
        document.getElementById('workstation').style.display = 'none';
      }
    }

    function handleLogin(e) {
      e.preventDefault();
      const pass = document.getElementById('password').value;
      const err = document.getElementById('error-msg');
      if (pass === VALID_PASS) {
        sessionStorage.setItem('debian_auth', 'true');
        err.style.display = 'none';
        checkAuth();
      } else {
        err.style.display = 'block';
      }
    }

    function handleLogout() {
      sessionStorage.removeItem('debian_auth');
      document.getElementById('frame-vnc').src = 'about:blank';
      document.getElementById('frame-term').src = 'about:blank';
      checkAuth();
    }

    function loadFrames() {
      const vncFrame = document.getElementById('frame-vnc');
      const termFrame = document.getElementById('frame-term');
      if (vncFrame.src === 'about:blank' || !vncFrame.src) {
        vncFrame.src = '/vnc/vnc.html?autoconnect=true&resize=remote&path=websockify&password=' + encodeURIComponent(VALID_PASS);
      }
      if (termFrame.src === 'about:blank' || !termFrame.src) {
        termFrame.src = '/terminal/';
      }
    }

    function showTab(tab) {
      activeTab = tab;
      const vncTab = document.getElementById('tab-vnc');
      const termTab = document.getElementById('tab-term');
      const vncFrame = document.getElementById('frame-vnc');
      const termFrame = document.getElementById('frame-term');
      if (tab === 'vnc') {
        vncTab.classList.add('active');
        termTab.classList.remove('active');
        vncFrame.classList.remove('hidden');
        termFrame.classList.add('hidden');
      } else {
        termTab.classList.add('active');
        vncTab.classList.remove('active');
        termFrame.classList.remove('hidden');
        vncFrame.classList.add('hidden');
      }
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    function reloadActive() {
      if (activeTab === 'vnc') {
        document.getElementById('frame-vnc').src = document.getElementById('frame-vnc').src;
      } else {
        document.getElementById('frame-term').src = document.getElementById('frame-term').src;
      }
    }

    checkAuth();
  </script>
</body>
</html>
