<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Debian 12 Cloud Workstation</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #0f111a; color: #fff; }
    #header {
      height: 48px;
      background: #1a1b26;
      border-bottom: 1px solid #2a2c3d;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      user-select: none;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      font-size: 15px;
      letter-spacing: 0.3px;
    }
    .brand-badge {
      background: #e95420;
      color: #fff;
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 4px;
      font-weight: bold;
    }
    .tabs {
      display: flex;
      gap: 6px;
      background: #13141f;
      padding: 4px;
      border-radius: 8px;
      border: 1px solid #282a3a;
    }
    .tab-btn {
      background: transparent;
      border: none;
      color: #a0a4b8;
      padding: 6px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }
    .tab-btn:hover { color: #fff; background: rgba(255,255,255,0.05); }
    .tab-btn.active { background: #3b82f6; color: #fff; box-shadow: 0 2px 6px rgba(59,130,246,0.3); }
    .controls { display: flex; align-items: center; gap: 10px; }
    .btn-ctrl {
      background: #242638;
      border: 1px solid #363952;
      color: #c0c4de;
      padding: 5px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .btn-ctrl:hover { background: #32354d; color: #fff; }
    #content { width: 100%; height: calc(100% - 48px); position: relative; background: #000; }
    iframe { width: 100%; height: 100%; border: none; position: absolute; top: 0; left: 0; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="header">
    <div class="brand">
      <span class="brand-badge">Debian 12</span>
      <span>Cloud Workstation</span>
    </div>
    <div class="tabs">
      <button class="tab-btn active" id="tab-vnc" onclick="showTab('vnc')">
        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
        Desktop (VNC)
      </button>
      <button class="tab-btn" id="tab-term" onclick="showTab('term')">
        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
        Terminal
      </button>
    </div>
    <div class="controls">
      <button class="btn-ctrl" onclick="toggleFullscreen()">
        <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
        Fullscreen
      </button>
      <button class="btn-ctrl" onclick="reloadActive()">
        <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        Reload
      </button>
    </div>
  </div>
  <div id="content">
    <iframe id="frame-vnc" src="/vnc/vnc.html?autoconnect=true&resize=remote&path=websockify"></iframe>
    <iframe id="frame-term" class="hidden" src="/terminal/"></iframe>
  </div>
  <script>
    let activeTab = 'vnc';
    function showTab(tab) {
      activeTab = tab;
      const vncTab = document.getElementById('tab-vnc');
      const termTab = document.getElementById('tab-term');
      const vncFrame = document.getElementById('frame-vnc');
      const termFrame = document.getElementById('frame-term');
      if (tab === 'vnc') {
        vncTab.classList.add('active');
        termTab.classList.remove('active');
        vncFrame.classList.remove('hidden');
        termFrame.classList.add('hidden');
      } else {
        termTab.classList.add('active');
        vncTab.classList.remove('active');
        termFrame.classList.remove('hidden');
        vncFrame.classList.add('hidden');
      }
    }
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }
    function reloadActive() {
      if (activeTab === 'vnc') {
        document.getElementById('frame-vnc').src = document.getElementById('frame-vnc').src;
      } else {
        document.getElementById('frame-term').src = document.getElementById('frame-term').src;
      }
    }
  </script>
</body>
</html>
